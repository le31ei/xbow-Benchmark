events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 65;

    # WebSocket 连接升级
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # benchmark 编号 -> 容器监听端口（由 start-gateway.sh 自动生成）
    include /etc/nginx/ports.map;

    # 从 Referer 提取 benchmark 编号：应用常用根绝对路径(/static/...)引用资源，
    # 这些请求不带 /xben-NNN/ 前缀，靠加载它的页面的 Referer 判定归属哪个 benchmark
    map $http_referer $ref_bnum {
        default "";
        "~/xben-(?<refn>[0-9]{3})/" $refn;
    }

    # 归属判定：优先 Referer；Referer 认不出（如应用跳转到 /login 后地址栏丢了前缀）
    # 则退回 cookie xben_route（访问 /xben-NNN/ 时种下）。源串 = "<ref>:<cookie>"
    map "$ref_bnum:$cookie_xben_route" $route_bnum {
        default "";
        "~^(?<a>[0-9]{3}):" $a;      # Referer 命中，优先用它（多标签页友好）
        "~^:(?<b>[0-9]{3})" $b;      # Referer 为空，退回 cookie
    }

    server {
        listen 80;
        server_name _;

        # Docker 内置 DNS，用于请求时解析容器别名 xben-NNN
        # 这样未启动的 benchmark 只会返回 502，而不会让 nginx 启动失败
        resolver 127.0.0.11 ipv6=off valid=10s;

        # 导航主页
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location = /index.html {
            root /usr/share/nginx/html;
        }

        # 健康检查
        location = /health {
            access_log off;
            default_type text/plain;
            return 200 "healthy\n";
        }

        # /xben-001 (无斜杠) -> 重定向补斜杠
        # 含 {3} 的正则必须加引号，否则 nginx 把 { } 当成块分隔符
        location ~ "^/xben-([0-9]{3})$" {
            return 301 $scheme://$host$request_uri/;
        }

        # /xben-001/...  ->  http://xben-001/...
        # 容器别名 xben-NNN 由 benchmark 的 compose override 在 benchmark-net 上声明
        location ~ "^/xben-([0-9]{3})/(.*)$" {
            set $bnum $1;
            set $bpath $2;

            # 转发到容器别名 xben-NNN 的实际监听端口（见 ports.map）
            proxy_pass http://xben-$bnum:$bport/$bpath$is_args$args;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /xben-$bnum;

            # 记住归属：之后即使 Referer 丢了前缀，也能靠此 cookie 回源
            add_header Set-Cookie "xben_route=$bnum; Path=/" always;

            proxy_connect_timeout 75s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # WebSocket
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # 后端未启动时给出友好提示
            proxy_intercept_errors on;
            error_page 502 504 = @backend_down;
        }

        # 兜底：应用用根绝对路径引用的资源(/static/..., /api/... 等)或跳转后的页面。
        # 这些请求无 /xben-NNN/ 前缀，按 Referer 优先、cookie 退回判定归属并回源。
        # 仍无法判定(无 Referer 且无 cookie)则 404。
        location / {
            set $bnum $route_bnum;
            if ($bnum = "") {
                return 404;
            }

            proxy_pass http://xben-$bnum:$bport$request_uri;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /xben-$bnum;

            # 刷新归属 cookie，保持与当前实际访问的 benchmark 一致
            add_header Set-Cookie "xben_route=$bnum; Path=/" always;

            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_intercept_errors on;
            error_page 502 504 = @backend_down;
        }

        location @backend_down {
            default_type text/html;
            return 502 '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Benchmark 未启动</title><style>body{font-family:sans-serif;text-align:center;padding:60px;color:#333}h1{color:#e53e3e}a{color:#667eea}</style></head><body><h1>502 - Benchmark 未运行</h1><p>该 benchmark 容器尚未启动或仍在初始化。</p><p>请用 <code>./start-gateway.sh start --start N --end M</code> 启动它，稍候再试。</p><a href="/">返回首页</a></body></html>';
        }
    }
}
